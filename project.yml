name: NeedMoreTokens
options:
  bundleIdPrefix: com.aylee1024
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  NeedMoreTokensKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Local ad-hoc signing so the app runs without an Apple Developer team.
    # App Group + widget (which need a team) arrive in the next step.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  NeedMoreTokens:
    type: application
    platform: macOS
    sources:
      - path: Sources/NeedMoreTokensApp
    dependencies:
      - package: NeedMoreTokensKit
        product: NeedMoreTokensKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aylee1024.needmoretokens
        PRODUCT_NAME: NeedMoreTokens
        GENERATE_INFOPLIST_FILE: "YES"
        # Menu-bar agent: no Dock icon, no main window.
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Andrew Lee — MIT"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
