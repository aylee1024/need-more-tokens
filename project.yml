name: NeedMoreTokens
options:
  bundleIdPrefix: com.aylee1024
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  NeedMoreTokensKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # xcodebuild signs ad-hoc here ("Sign to Run Locally"); scripts/build.sh then RE-SIGNS
    # the product with a STABLE identity (Apple Development or Developer ID) before install.
    # That stable, unchanging designated requirement is what lets the one-time Keychain
    # "Always Allow" grant for Claude Code-credentials + gemini/antigravity survive rebuilds.
    # An Apple-Development-signed, locally-built, non-quarantined app launches fine via
    # open/Finder/login items (re-verified 2026-06-19); `spctl` "rejected" is the
    # distribution/notarization assessment and does NOT block a local launch. Do NOT ship a
    # plain ad-hoc build via --install: its requirement changes every build and wipes the
    # grant, bringing the recurring prompt back (build.sh now refuses an ad-hoc --install).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  NeedMoreTokens:
    type: application
    platform: macOS
    sources:
      - path: Sources/NeedMoreTokensApp
    dependencies:
      - package: NeedMoreTokensKit
        product: NeedMoreTokensKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aylee1024.needmoretokens
        PRODUCT_NAME: NeedMoreTokens
        GENERATE_INFOPLIST_FILE: "YES"
        # Menu-bar agent: no Dock icon, no main window.
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Andrew Lee — MIT"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        # Build via scripts/build.sh — it re-signs the product with a stable identity
        # (NMT_SIGN_IDENTITY) AFTER xcodebuild, so the Keychain "Always Allow" grant for
        # Claude Code-credentials persists across rebuilds. (An in-build postBuildScript
        # is unreliable here: xcodebuild's own CodeSign phase clobbers it.)
