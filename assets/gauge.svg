<svg width="480" height="320" viewBox="0 0 480 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Need More Tokens menu-bar gauge">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t    { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
      .name { font-weight: 600; fill: #f5f5f7; font-size: 15px; }
      .pct  { font-weight: 700; font-size: 15px; }
      .sub  { fill: #8e8e93; font-size: 11px; }
      .ttl  { fill: #f5f5f7; font-weight: 700; font-size: 20px; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="468" height="308" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.10"/>
  <rect x="6" y="6" width="468" height="110" rx="24" fill="url(#sheen)"/>

  <!-- header -->
  <text x="30" y="50" class="t ttl">⚡ Need More Tokens</text>
  <circle cx="442" cy="44" r="11" fill="none" stroke="#8e8e93" stroke-width="2"/>
  <circle cx="442" cy="44" r="3.2" fill="#8e8e93"/>

  <!-- Claude -->
  <text x="30" y="100" class="t name">Claude</text>
  <text x="450" y="100" text-anchor="end" class="t pct" fill="#30d158">26%</text>
  <rect x="30" y="112" width="420" height="9" rx="4.5" fill="#3a3a3c"/>
  <rect x="30" y="112" width="109" height="9" rx="4.5" fill="#30d158"/>
  <text x="30" y="140" class="t sub">5-hour · resets in 4h 49m</text>

  <!-- Codex -->
  <text x="30" y="176" class="t name">Codex</text>
  <text x="450" y="176" text-anchor="end" class="t pct" fill="#ff9f0a">74%</text>
  <rect x="30" y="188" width="420" height="9" rx="4.5" fill="#3a3a3c"/>
  <rect x="30" y="188" width="311" height="9" rx="4.5" fill="#ff9f0a"/>
  <text x="30" y="216" class="t sub">weekly · resets in 4d 11h</text>

  <!-- Gemini -->
  <text x="30" y="252" class="t name">Gemini</text>
  <text x="450" y="252" text-anchor="end" class="t pct" fill="#ff453a">96%</text>
  <rect x="30" y="264" width="420" height="9" rx="4.5" fill="#3a3a3c"/>
  <rect x="30" y="264" width="403" height="9" rx="4.5" fill="#ff453a"/>
  <text x="30" y="292" class="t sub">weekly · almost out 🪫</text>
</svg>
